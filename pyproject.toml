[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaea-rhythm-analysis"
version = "0.3.0"
description = "Arcaea 谱面节奏解析、SVG 与按键音预览工具"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "soundfile>=0.14",
    "soxr>=1.1",
    "svgwrite>=1.4.3",
    "tqdm>=4.70",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
arcaea-rhythm = "arcaea_rhythm.cli:main"

[tool.setuptools]
packages = ["arcaea_rhythm"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
